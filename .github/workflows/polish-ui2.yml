name: Polish UI 2.0 preview

on:
  push:
    branches: [feat/ui-2-modern]
    paths:
      - .github/workflows/polish-ui2.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-2-modern
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply visual polish
        run: python3 scripts/polish-ui2.py
      - name: Rebuild fingerprinted assets
        run: node scripts/build-assets.mjs --write
      - name: Validate build and performance contracts
        run: |
          node --check js/app.js
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh compact review frames
        run: node scripts/ui2-preview.mjs
      - name: Commit polished product and review frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.template.html index.html _headers css/style.css js/app.js assets/build tmp-ui-review
          git commit -m "Polish UI 2.0 typography and mobile hero"
          git push origin HEAD:feat/ui-2-modern
