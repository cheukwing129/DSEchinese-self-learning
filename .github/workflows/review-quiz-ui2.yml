name: Review quiz UI 2.0

on:
  push:
    branches: [feat/quiz-ui-2]
    paths:
      - .github/workflows/review-quiz-ui2.yml

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quiz-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate fingerprinted build
        run: node scripts/build-assets.mjs --check
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture quiz review frames
        run: node scripts/quiz-ui2-preview.mjs
      - name: Upload quiz review frames
        uses: actions/upload-artifact@v4
        with:
          name: quiz-ui2-review
          path: tmp-quiz-ui2-review/*.jpg
          if-no-files-found: error
          retention-days: 1
