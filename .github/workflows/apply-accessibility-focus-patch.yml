name: Apply accessibility focus patch

on:
  push:
    branches:
      - fix/accessibility-interactions
    paths:
      - .github/workflows/apply-accessibility-focus-patch.yml
      - scripts/patch-accessibility-focus.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/accessibility-interactions
          fetch-depth: 0
      - name: Check patch script
        run: python3 -m py_compile scripts/patch-accessibility-focus.py
      - name: Apply focus patch
        run: python3 scripts/patch-accessibility-focus.py
      - name: Check JavaScript syntax
        run: |
          node --check js/question-engine.js
          node --check js/content-renderer.js
          node --check js/memorisation-engine.js
      - name: Guard focus behavior
        run: |
          grep -q 'tabindex="-1" aria-live="polite"' js/question-engine.js
          grep -q 'restoreChoiceFocus(".tf-btn"' js/question-engine.js
          grep -q 'id="reorder-result"' js/memorisation-engine.js
      - name: Commit patched files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/question-engine.js js/content-renderer.js js/memorisation-engine.js
          git commit -m "Preserve keyboard focus across interactions"
          git push origin HEAD:fix/accessibility-interactions
