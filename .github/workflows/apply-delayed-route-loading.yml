name: One-time delayed route loading

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-delayed-route-loading.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Delay transient SPA loading state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''  function renderFatalError(message) {\n''',
          '''  function scheduleLoading(label, navigationId, delay = 120) {\n    syncHeaderState();\n    const timer = window.setTimeout(() => {\n      if (Router.isCurrentNavigation(navigationId)) renderLoading(label);\n    }, delay);\n    return () => window.clearTimeout(timer);\n  }\n\n  function renderFatalError(message) {\n''',
          "delayed loading helper"
          )

          replace_once(
          '''    setCrumb("");\n    renderLoading("課程地圖");\n    let curriculum;\n    try {\n      curriculum = await loadCurriculum();\n      if (!Router.isCurrentNavigation(navigationId)) return;\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n      return;\n    }\n''',
          '''    setCrumb("");\n    const cancelLoading = scheduleLoading("課程地圖", navigationId);\n    let curriculum;\n    try {\n      curriculum = await loadCurriculum();\n      if (!Router.isCurrentNavigation(navigationId)) return;\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n      return;\n    } finally {\n      cancelLoading();\n    }\n''',
          "home loading"
          )

          replace_once(
          '''    setCrumb("跨篇章學習總覽");\n    renderLoading("跨篇章學習總覽");\n    try {\n      const [{ curriculum, unitBundles }] = await Promise.all([\n        loadCrossUnitBundles(),\n        loadUIModules(["contentProgress", "progressAnalytics"])\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      ContentRenderer.renderCrossUnitOverview(curriculum, unitBundles);\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n    }\n''',
          '''    setCrumb("跨篇章學習總覽");\n    const cancelLoading = scheduleLoading("跨篇章學習總覽", navigationId);\n    try {\n      const [{ curriculum, unitBundles }] = await Promise.all([\n        loadCrossUnitBundles(),\n        loadUIModules(["contentProgress", "progressAnalytics"])\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      ContentRenderer.renderCrossUnitOverview(curriculum, unitBundles);\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n    } finally {\n      cancelLoading();\n    }\n''',
          "overview loading"
          )

          replace_once(
          '''    setCrumb(ability ? `${ability} · 跨篇章重練` : "跨篇章錯題重練");\n    renderLoading("跨篇章錯題重練");\n    try {\n      const [{ unitBundles }] = await Promise.all([\n        loadCrossUnitBundles(),\n        loadUIModules(["questions", "progressAnalytics"])\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      QuestionEngine.renderCrossUnitWrongRetry(unitBundles, ability);\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n    }\n''',
          '''    setCrumb(ability ? `${ability} · 跨篇章重練` : "跨篇章錯題重練");\n    const cancelLoading = scheduleLoading("跨篇章錯題重練", navigationId);\n    try {\n      const [{ unitBundles }] = await Promise.all([\n        loadCrossUnitBundles(),\n        loadUIModules(["questions", "progressAnalytics"])\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      QuestionEngine.renderCrossUnitWrongRetry(unitBundles, ability);\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n    } finally {\n      cancelLoading();\n    }\n''',
          "retry loading"
          )

          replace_once(
          '''    const uiModules = [...new Set(options.uiModules || [])];\n    renderLoading("篇章資料");\n    let bundle;\n    try {\n      [bundle] = await Promise.all([\n        loadUnitBundle(unitId, options || {}),\n        loadUIModules(uiModules)\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n      return;\n    }\n''',
          '''    const uiModules = [...new Set(options.uiModules || [])];\n    const cancelLoading = scheduleLoading("篇章資料", navigationId);\n    let bundle;\n    try {\n      [bundle] = await Promise.all([\n        loadUnitBundle(unitId, options || {}),\n        loadUIModules(uiModules)\n      ]);\n      if (!Router.isCurrentNavigation(navigationId)) return;\n    } catch (e) {\n      if (!Router.isCurrentNavigation(navigationId)) return;\n      renderFatalError(e.message);\n      return;\n    } finally {\n      cancelLoading();\n    }\n''',
          "unit loading"
          )

          path.write_text(text)
          PY

      - name: Rebuild and validate
        run: |
          node --check js/app.js
          node scripts/validate-loading.mjs
          node scripts/build-assets.mjs --write
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs

      - name: Commit source and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js assets/build index.html _headers
          git commit -m "Avoid transient loading flashes on warm routes"
          git push
