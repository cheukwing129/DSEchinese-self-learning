name: Apply progress UI 2.0

on:
  push:
    branches: [feat/progress-ui-2]
    paths:
      - scripts/patch-progress-ui2.py
      - .github/workflows/apply-progress-ui2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/progress-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply progress UI patch
        run: |
          python scripts/patch-progress-ui2.py
          python - <<'PY'
          from pathlib import Path
          p = Path('js/content-renderer.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('錯誤歷史不會因答對而刪除', '錯誤歷史不會刪除；即使之後答對，歷史仍保留')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Rebuild fingerprinted assets
        run: node scripts/build-assets.mjs --write
      - name: Validate core contracts
        run: |
          node --check js/content-renderer.js
          node scripts/validate-accessibility.mjs
          node scripts/validate-learning-continuity.mjs
          node scripts/validate-wrong-answer-retry.mjs
          node scripts/validate-cross-unit-overview.mjs
          node scripts/validate-cross-unit-targeted-retry.mjs
          node scripts/validate-loading.mjs
          node scripts/validate-performance.mjs
          node scripts/build-assets.mjs --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/content-renderer.js css/style.css scripts/browser-smoke.mjs assets/build index.html _headers
          git diff --cached --quiet && exit 0
          git commit -m "Redesign learning progress and cross-unit overview"
          git push origin HEAD:feat/progress-ui-2
