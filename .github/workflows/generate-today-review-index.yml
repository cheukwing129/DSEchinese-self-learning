name: Generate today review index

on:
  push:
    branches:
      - ux/today-review

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ux/today-review

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate deterministic outputs
        run: node scripts/build-assets.mjs --write

      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- index.html _headers assets/build; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers assets/build
          git commit -m "Generate today review index"
          git push origin HEAD:ux/today-review
