name: Capture UI preview

on:
  push:
    branches:
      - feat/ui-refinement
    paths:
      - scripts/capture-ui-preview.mjs
      - .github/workflows/capture-ui-preview.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-refinement
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ui-server.log 2>&1 &
          echo $! > /tmp/ui-server.pid
          sleep 2
      - name: Capture previews
        run: node scripts/capture-ui-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
