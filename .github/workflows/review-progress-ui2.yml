name: Review progress UI 2.0

on:
  push:
    branches: [feat/progress-ui-2]
    paths:
      - scripts/progress-ui2-preview.mjs
      - .github/workflows/review-progress-ui2.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/progress-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate fingerprinted build
        run: node scripts/build-assets.mjs --check
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture progress review frames
        run: node scripts/progress-ui2-preview.mjs
      - name: Upload progress review frames
        uses: actions/upload-artifact@v4
        with:
          name: progress-ui2-review
          path: progress-ui2-review/
          retention-days: 1
