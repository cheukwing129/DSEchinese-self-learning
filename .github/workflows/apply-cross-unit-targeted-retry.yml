name: Validate cross-unit targeted retry branch

on:
  push:
    branches:
      - feat/cross-unit-targeted-retry
    paths:
      - .github/workflows/apply-cross-unit-targeted-retry.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/cross-unit-targeted-retry
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Validate targeted retry behavior
        run: node scripts/validate-cross-unit-targeted-retry.mjs
      - name: Validate lazy-loading contract
        run: node scripts/validate-loading.mjs
