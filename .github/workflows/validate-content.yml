name: Validate content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript, content correctness, accessibility, loading, learning flows, route safety, fingerprints and performance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js assets/build/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate curriculum and question data
        run: node scripts/validate-data.mjs

      - name: Validate question and source-text correctness contracts
        run: node scripts/validate-content-correctness.mjs

      - name: Validate accessibility interactions
        run: node scripts/validate-accessibility.mjs

      - name: Validate lazy-loading contract
        run: node scripts/validate-loading.mjs

      - name: Validate background and rubric integration
        run: node scripts/validate-learning-support.mjs

      - name: Validate learning continuity guidance
        run: node scripts/validate-learning-continuity.mjs

      - name: Validate wrong-answer retry loop
        run: node scripts/validate-wrong-answer-retry.mjs

      - name: Validate cross-unit learning overview
        run: node scripts/validate-cross-unit-overview.mjs

      - name: Validate cross-unit targeted retry
        run: node scripts/validate-cross-unit-targeted-retry.mjs

      - name: Validate route race protection
        run: node scripts/validate-route-race.mjs

      - name: Validate fingerprinted asset build
        run: node scripts/build-assets.mjs --check

      - name: Validate initial-load performance contract
        run: node scripts/validate-performance.mjs

  browser-smoke:
    name: Chromium smoke, constrained-mobile performance, full-site QA and warm-cache performance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real-browser smoke and performance contract
        run: node scripts/browser-smoke.mjs

      - name: Run constrained-mobile performance contract
        run: node scripts/mobile-performance.mjs

      - name: Run full pre-launch browser QA matrix
        run: node scripts/prelaunch-qa.mjs
