name: Validate content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: JavaScript, content, accessibility, loading and learning support
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate curriculum and question data
        run: node scripts/validate-data.mjs

      - name: Validate accessibility interactions
        run: node scripts/validate-accessibility.mjs

      - name: Validate lazy-loading contract
        run: node scripts/validate-loading.mjs

      - name: Validate background and rubric integration
        run: node scripts/validate-learning-support.mjs
