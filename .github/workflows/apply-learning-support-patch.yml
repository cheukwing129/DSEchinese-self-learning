name: Apply learning support patch

on:
  push:
    branches:
      - feat/use-background-rubrics
    paths:
      - scripts/patch-learning-support.py
      - .github/workflows/apply-learning-support-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/use-background-rubrics
      - name: Apply patch
        run: python scripts/patch-learning-support.py
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Guard learning support integration
        run: |
          grep -q 'resources: \["background"\]' js/app.js
          grep -q 'resources: \["memorisation", "rubrics"\]' js/app.js
          grep -q 'function rubricFallbackElements' js/question-engine.js
          grep -q '自我檢核' js/content-renderer.js
          grep -q 'setSelfReviewItem' js/progress.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/content-renderer.js js/progress.js js/question-engine.js
          git commit -m "Use background and rubric data in learning flows"
          git push
