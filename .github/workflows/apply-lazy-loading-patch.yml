name: Apply lazy loading patch

on:
  push:
    branches:
      - perf/lazy-load-unit-data
    paths:
      - scripts/patch-lazy-loading.py
      - .github/workflows/apply-lazy-loading-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: perf/lazy-load-unit-data
      - name: Apply patch
        run: python scripts/patch-lazy-loading.py
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Guard against eager bundle loading
        run: |
          ! grep -q 'fetchJSON(`${base}/text.json`)' js/app.js
          grep -q 'resources: \["text"\]' js/app.js
          grep -q 'allQuestionBanks: true' js/app.js
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Lazy-load unit data by route"
            git push origin HEAD:perf/lazy-load-unit-data
          fi
