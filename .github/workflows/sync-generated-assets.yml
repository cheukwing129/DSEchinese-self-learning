name: Sync generated assets

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-assets.mjs

permissions:
  contents: write

jobs:
  sync:
    name: Rebuild and commit fingerprinted assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild generated assets
        run: node scripts/build-assets.mjs --write

      - name: Commit generated outputs when changed
        run: |
          if git diff --quiet -- index.html _headers assets/build; then
            echo "Generated assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers assets/build
          git commit -m "Sync generated fingerprinted assets"
          git push
