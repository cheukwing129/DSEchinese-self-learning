name: One-time dead brand CSS cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-dead-brand-css.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Remove legacy text-mark logo CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('css/style.css')
          text = path.read_text()
          pattern = r'\.brand \.brand-mark\s*\{[^{}]*\}'
          text, count = re.subn(pattern, '', text)
          if not 2 <= count <= 4:
              raise SystemExit(f'expected 2–4 exact legacy .brand .brand-mark rules, got {count}')
          if '.brand .brand-mark' in text:
              raise SystemExit('legacy .brand .brand-mark selector still remains')
          if '.brand-mark-image' not in text:
              raise SystemExit('current SVG brand-mark-image styling was unexpectedly removed')
          print(f'Removed {count} obsolete .brand .brand-mark rule blocks.')
          path.write_text(text)
          PY

          node scripts/build-assets.mjs --write
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs
      - name: Commit source and regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css assets/build index.html _headers
          git commit -m "Remove obsolete pre-SVG brand mark CSS"
          git push
