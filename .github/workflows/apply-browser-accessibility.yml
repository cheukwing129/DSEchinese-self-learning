name: One-time browser accessibility migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-browser-accessibility.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply keyboard and focus fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          app_path = Path("js/app.js")
          app = app_path.read_text()
          app = replace_once(
              app,
              '  const crumbEl = () => document.getElementById("header-crumb");\n',
              '  const crumbEl = () => document.getElementById("header-crumb");\n  let pendingRouteFocus = false;\n  let ignoreNextHashFocus = false;\n',
              "app header insertion point",
          )

          app = replace_once(
              app,
              '''  function mount(html) {
            mainEl().innerHTML = html;
          }
'''.replace('            mainEl', '    mainEl').replace('          }', '  }'),
              '''  function focusPrimaryContent() {
    const main = mainEl();
    if (!main) return;
    const heading = main.querySelector("h1.page-title, h1");
    const target = heading || main;
    const addedTabIndex = !target.hasAttribute("tabindex");
    if (addedTabIndex) target.setAttribute("tabindex", "-1");
    target.focus({ preventScroll: true });
    if (addedTabIndex) {
      target.addEventListener("blur", () => target.removeAttribute("tabindex"), { once: true });
    }
  }

  function mount(html) {
    const main = mainEl();
    main.innerHTML = html;
    if (pendingRouteFocus && !main.querySelector(".loading-state")) {
      pendingRouteFocus = false;
      focusPrimaryContent();
    }
  }

  function bindKeyboardNavigation() {
    const skipLink = document.querySelector(".skip-link");
    if (skipLink) {
      skipLink.addEventListener("click", (event) => {
        event.preventDefault();
        pendingRouteFocus = false;
        const main = mainEl();
        main.focus({ preventScroll: true });
        main.scrollIntoView({ block: "start" });
      });
    }

    ignoreNextHashFocus = !window.location.hash;
    window.addEventListener("hashchange", () => {
      if (ignoreNextHashFocus) {
        ignoreNextHashFocus = false;
        return;
      }
      pendingRouteFocus = true;
    });
  }
''',
              "app mount block",
          )

          app = replace_once(
              app,
              '''  function init() {
    registerRoutes();
    Router.start();
  }
''',
              '''  function init() {
    bindKeyboardNavigation();
    registerRoutes();
    Router.start();
  }
''',
              "app init block",
          )
          app_path.write_text(app)

          content_path = Path("js/content-renderer.js")
          content = content_path.read_text()
          content = replace_once(
              content,
              'aria-selected="${i === activeIndex ? "true" : "false"}" data-idx="${i}" class="${i === activeIndex ? "is-active" : ""}"',
              'aria-selected="${i === activeIndex ? "true" : "false"}" tabindex="${i === activeIndex ? "0" : "-1"}" data-idx="${i}" class="${i === activeIndex ? "is-active" : ""}"',
              "reader tab markup",
          )
          content = replace_once(
              content,
              '''      document.querySelectorAll(".reader-nav button").forEach((btn) => {
        btn.addEventListener("click", () => setActive(parseInt(btn.dataset.idx, 10)));
      });
''',
              '''      const activateTab = (index) => {
        setActive(index);
        const tab = document.getElementById(`reader-tab-${index}`);
        if (tab) tab.focus({ preventScroll: true });
      };
      document.querySelectorAll(".reader-nav button").forEach((btn) => {
        btn.addEventListener("click", () => activateTab(parseInt(btn.dataset.idx, 10)));
        btn.addEventListener("keydown", (event) => {
          const current = parseInt(btn.dataset.idx, 10);
          let nextIndex = null;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") nextIndex = (current + 1) % groups.length;
          else if (event.key === "ArrowLeft" || event.key === "ArrowUp") nextIndex = (current - 1 + groups.length) % groups.length;
          else if (event.key === "Home") nextIndex = 0;
          else if (event.key === "End") nextIndex = groups.length - 1;
          if (nextIndex == null) return;
          event.preventDefault();
          activateTab(nextIndex);
        });
      });
''',
              "reader tab event block",
          )
          content_path.write_text(content)

          validator_path = Path("scripts/validate-accessibility.mjs")
          validator = validator_path.read_text()
          validator = replace_once(
              validator,
              'const files = {\n  questions:',
              'const files = {\n  app: fs.readFileSync("js/app.js", "utf8"),\n  questions:',
              "accessibility files map",
          )
          marker = 'requireMatch("Mobile header touch target", files.index, /@media\\s*\\(max-width:\\s*600px\\)\\s*\\{\\s*\\.header-nav-link\\s*\\{\\s*min-height:\\s*44px/s);'
          validator = replace_once(
              validator,
              marker,
              marker + '''
requireMatch("Skip-link hash protection", files.app, /skipLink\\.addEventListener\\("click"[\\s\\S]*?event\\.preventDefault\\(\\)[\\s\\S]*?main\\.focus/);
requireMatch("SPA route focus management", files.app, /pendingRouteFocus[\\s\\S]*?focusPrimaryContent\\(\\)/);
requireMatch("Reader roving tab stop", files.content, /role=\\"tab\\"[\\s\\S]*?tabindex=\\"\\$\\{i === activeIndex \\? \\"0\\" : \\"-1\\"\\}\\"/);
requireMatch("Reader arrow-key tabs", files.content, /ArrowRight[\\s\\S]*?ArrowLeft[\\s\\S]*?Home[\\s\\S]*?End/);''',
              "accessibility validator insertion point",
          )
          validator_path.write_text(validator)

          workflow_path = Path(".github/workflows/validate-content.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              '''      - name: Run real-browser smoke and performance contract
        run: node scripts/browser-smoke.mjs
''',
              '''      - name: Run real-browser smoke and performance contract
        run: node scripts/browser-smoke.mjs

      - name: Run keyboard and focus accessibility contract
        run: node scripts/browser-accessibility.mjs
''',
              "validate workflow browser step",
          )
          workflow_path.write_text(workflow)
          PY

      - name: Rebuild and verify assets
        run: |
          node --check js/app.js
          node --check js/content-renderer.js
          node --check scripts/browser-accessibility.mjs
          node scripts/validate-accessibility.mjs
          node scripts/build-assets.mjs
          node scripts/build-assets.mjs --check

      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-browser-accessibility.yml
          git add -A
          git commit -m "Improve keyboard navigation and route focus"
          git push
