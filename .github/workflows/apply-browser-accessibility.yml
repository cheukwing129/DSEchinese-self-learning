name: One-time browser accessibility migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-browser-accessibility.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply keyboard and focus fixes
        run: python scripts/apply-accessibility-migration.py

      - name: Rebuild and verify assets
        run: |
          node --check js/app.js
          node --check js/content-renderer.js
          node --check scripts/browser-accessibility.mjs
          node scripts/validate-accessibility.mjs
          node scripts/build-assets.mjs --write
          node scripts/build-assets.mjs --check

      - name: Commit accessibility source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-accessibility-migration.py
          git add -A
          git commit -m "Improve keyboard navigation and route focus"
          git push
