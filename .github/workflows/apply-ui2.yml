name: Apply UI 2.0 preview

on:
  push:
    branches: [feat/ui-2-modern]
    paths:
      - .github/workflows/apply-ui2.yml

permissions:
  contents: write

jobs:
  apply-and-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/ui-2-modern
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply UI source patch
        run: python3 scripts/patch-ui2.py
      - name: Regenerate fingerprinted runtime assets
        run: node scripts/build-assets.mjs --write
      - name: Validate syntax and asset contract
        run: |
          node --check js/app.js
          node --check js/content-renderer.js
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render desktop and mobile previews
        run: node scripts/ui2-preview.mjs
      - name: Commit product changes and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers css/style.css js/app.js js/content-renderer.js assets/build tmp-ui-preview
          git commit -m "Build modern editorial UI 2.0 preview"
          git push origin HEAD:feat/ui-2-modern
