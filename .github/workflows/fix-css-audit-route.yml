name: One-time CSS audit route fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-css-audit-route.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch fatal-route navigation
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/css-coverage.mjs"); t=p.read_text(); old="  for (const route of routes) {\n    await page.goto(`${baseURL}/#${route}`, { waitUntil: \"domcontentloaded\", timeout: 12000 });\n    if (route === \"/not-a-real-route\") {\n      await page.locator(\".launch-state.is-error\").waitFor({ state: \"visible\", timeout: 8000 });\n      await page.waitForTimeout(25);\n      visited += 1;\n      continue;\n    }\n\n    await page.locator(\"#app-main > *\").first().waitFor({ state: \"visible\", timeout: 8000 });\n"; new="  for (const route of routes) {\n    if (route === \"/not-a-real-route\") {\n      await page.evaluate(() => { window.location.hash = \"#/not-a-real-route\"; });\n      await page.locator(\".launch-state.is-error\").waitFor({ state: \"visible\", timeout: 8000 });\n      await page.waitForTimeout(25);\n      visited += 1;\n      continue;\n    }\n\n    await page.goto(`${baseURL}/#${route}`, { waitUntil: \"domcontentloaded\", timeout: 12000 });\n    await page.locator(\"#app-main > *\").first().waitFor({ state: \"visible\", timeout: 8000 });\n"; assert old in t, "expected audit block not found"; p.write_text(t.replace(old,new,1))'
          node --check scripts/css-coverage.mjs
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-css-audit-route.yml
          git add scripts/css-coverage.mjs
          git commit -m "Fix rare-state error route audit"
          git push
