name: One-time CSS audit route fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-css-audit-route.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Patch fatal-route navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/css-coverage.mjs')
          text = path.read_text()
          old = '''  for (const route of routes) {
    await page.goto(`${baseURL}/#${route}`, { waitUntil: "domcontentloaded", timeout: 12000 });
    if (route === "/not-a-real-route") {
      await page.locator(".launch-state.is-error").waitFor({ state: "visible", timeout: 8000 });
      await page.waitForTimeout(25);
      visited += 1;
      continue;
    }

    await page.locator("#app-main > *").first().waitFor({ state: "visible", timeout: 8000 });
'''
          new = '''  for (const route of routes) {
    if (route === "/not-a-real-route") {
      await page.evaluate(() => { window.location.hash = "#/not-a-real-route"; });
      await page.locator(".launch-state.is-error").waitFor({ state: "visible", timeout: 8000 });
      await page.waitForTimeout(25);
      visited += 1;
      continue;
    }

    await page.goto(`${baseURL}/#${route}`, { waitUntil: "domcontentloaded", timeout: 12000 });
    await page.locator("#app-main > *").first().waitFor({ state: "visible", timeout: 8000 });
'''
          if old not in text:
              raise SystemExit('expected audit block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/css-coverage.mjs

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-css-audit-route.yml
          git add scripts/css-coverage.mjs
          git commit -m "Fix rare-state error route audit"
          git push
