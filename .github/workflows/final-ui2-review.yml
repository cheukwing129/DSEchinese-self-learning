name: Final UI 2.0 visual review

on:
  push:
    branches: [feat/ui-2-modern]
    paths:
      - .github/workflows/final-ui2-review.yml

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-2-modern
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate current fingerprinted build
        run: node scripts/build-assets.mjs --check
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture final review frames
        run: node scripts/ui2-preview.mjs
      - name: Upload final review frames
        uses: actions/upload-artifact@v4
        with:
          name: ui2-final-review
          path: tmp-ui-review/*.jpg
          if-no-files-found: error
          retention-days: 1
