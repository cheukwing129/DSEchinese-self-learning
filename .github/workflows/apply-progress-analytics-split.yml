name: One-time progress analytics split

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-progress-analytics-split.yml]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Split route-only progress analytics
        run: python scripts/split-progress-analytics.py

      - name: Repair extracted core boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("js/progress.js")
          text = path.read_text()
          start_marker = "  return {\n      engagedUnits,"
          export_marker = "  return {\n    recordAnswer, getAnswer, getAllAnswers,"
          start = text.find(start_marker)
          end = text.find(export_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("post-split boundary markers not found")
          path.write_text(text[:start] + text[end:])
          PY

      - name: Rebuild and validate split
        run: |
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/validate-loading.mjs
          node scripts/validate-cross-unit-overview.mjs
          node scripts/validate-cross-unit-targeted-retry.mjs
          node scripts/build-assets.mjs --write
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs

      - name: Commit split and rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/split-progress-analytics.py
          git add -A
          git commit -m "Lazy-load cross-unit progress analytics"
          git push
