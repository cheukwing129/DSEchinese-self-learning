name: One-time route-focus trim

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-route-focus-trim.yml]

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Trim route-focus implementation
        run: python scripts/trim-route-focus.py

      - name: Rebuild and verify
        run: |
          node --check js/app.js
          node scripts/validate-accessibility.mjs
          node scripts/build-assets.mjs --write
          node scripts/build-assets.mjs --check
          node scripts/validate-performance.mjs

      - name: Commit source and rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/trim-route-focus.py
          git add -A
          git commit -m "Trim route focus without raising startup budget"
          git push
