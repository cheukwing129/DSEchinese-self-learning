name: Apply quiz UI 2.0

on:
  push:
    branches: [feat/quiz-ui-2]
    paths:
      - .github/workflows/apply-quiz-ui2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quiz-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply quiz UI patch
        run: python3 scripts/patch-quiz-ui2.py
      - name: Rebuild fingerprinted assets
        run: node scripts/build-assets.mjs --write
      - name: Validate core contracts
        run: |
          node --check js/question-engine.js
          node scripts/build-assets.mjs --check
          node scripts/validate-accessibility.mjs
          node scripts/validate-loading.mjs
          node scripts/validate-learning-support.mjs
          node scripts/validate-wrong-answer-retry.mjs
          node scripts/validate-performance.mjs
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/style.css js/question-engine.js index.html _headers assets/build
          git commit -m "Redesign quiz answering workspace" || exit 0
          git push
