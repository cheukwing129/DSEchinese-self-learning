name: Apply wrong-answer retry patch

on:
  push:
    branches:
      - feat/wrong-answer-retry
    paths:
      - scripts/patch-wrong-answer-retry.py
      - .github/workflows/apply-wrong-answer-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/wrong-answer-retry
      - name: Apply patch
        run: python scripts/patch-wrong-answer-retry.py
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Guard wrong-answer retry integration
        run: |
          grep -q 'function everWrongQuestionIds' js/progress.js
          grep -q 'function renderWrongRetry' js/question-engine.js
          grep -q 'progress/retry-wrong' js/app.js
          grep -q '一鍵重練' js/content-renderer.js
          grep -q '錯誤歷史不會刪除' js/content-renderer.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/progress.js js/question-engine.js js/app.js js/content-renderer.js
          git commit -m "Add wrong-answer retry loop"
          git push
