name: Review content study UI 2.0

on:
  push:
    branches:
      - feat/content-study-ui-2
    paths:
      - scripts/content-study-preview.mjs
      - .github/workflows/review-content-study-ui2.yml

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/content-study-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate fingerprinted build
        run: node scripts/build-assets.mjs --check
      - name: Install pinned Playwright runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture content study review frames
        run: node scripts/content-study-preview.mjs
      - name: Upload content study review frames
        uses: actions/upload-artifact@v4
        with:
          name: content-study-ui2-review
          path: tmp-content-study-review/*.jpg
          retention-days: 1
