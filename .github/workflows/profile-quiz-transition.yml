name: Temporary quiz transition profile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-quiz-transition.yml
      - scripts/profile-quiz-transition.mjs

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Profile next-question transition
        run: node scripts/profile-quiz-transition.mjs
