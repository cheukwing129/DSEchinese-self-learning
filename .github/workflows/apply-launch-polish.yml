name: Apply launch polish

on:
  push:
    branches:
      - feat/launch-polish
    paths:
      - scripts/patch-launch-polish.py
      - scripts/generate-wenmai-share.py
      - .github/workflows/apply-launch-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/launch-polish
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply launch polish
        run: python scripts/patch-launch-polish.py
      - name: Generate social share image
        run: python scripts/generate-wenmai-share.py
      - name: Rebuild fingerprinted assets
        run: node scripts/build-assets.mjs --write
      - name: Validate launch polish contracts
        run: |
          node --check js/app.js
          node --check scripts/browser-smoke.mjs
          node --check scripts/production-smoke.mjs
          node scripts/validate-data.mjs
          node scripts/validate-accessibility.mjs
          node scripts/validate-loading.mjs
          node scripts/validate-learning-support.mjs
          node scripts/validate-learning-continuity.mjs
          node scripts/validate-wrong-answer-retry.mjs
          node scripts/validate-cross-unit-overview.mjs
          node scripts/validate-cross-unit-targeted-retry.mjs
          node scripts/validate-route-race.mjs
          node scripts/validate-performance.mjs
          test -f assets/brand/wenmai-mark.svg
          test -f assets/brand/wenmai-share.png
          grep -q 'wenmai-share.png' index.html
          grep -q 'launch-state is-not-found' js/app.js
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.template.html index.html _headers css/style.css js/app.js scripts/browser-smoke.mjs scripts/production-smoke.mjs assets/brand assets/build
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Polish launch shell and brand states"
            git push origin HEAD:feat/launch-polish
          fi
