name: Polish reader UI 2.0

on:
  push:
    branches: [feat/reader-ui-2]
    paths:
      - scripts/polish-reader-ui2.py
      - .github/workflows/polish-reader-ui2.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reader-ui-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply reader polish
        run: python scripts/polish-reader-ui2.py
      - name: Rebuild fingerprinted assets
        run: node scripts/build-assets.mjs --write
      - name: Validate affected contracts
        run: |
          node --check js/content-renderer.js
          node scripts/validate-accessibility.mjs
          node scripts/validate-loading.mjs
          node scripts/validate-performance.mjs
          node scripts/build-assets.mjs --check
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css assets/build index.html _headers
          git diff --cached --quiet && exit 0
          git commit -m "Polish reader annotation sheet focus"
          git push origin HEAD:feat/reader-ui-2
