name: Apply progress page patch

on:
  push:
    branches:
      - feat/memorisation-progress
    paths:
      - .github/workflows/apply-progress-page-patch.yml
      - scripts/patch-progress-page.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: feat/memorisation-progress
          fetch-depth: 0

      - name: Apply progress page patch
        run: python3 scripts/patch-progress-page.py

      - name: Check patched JavaScript syntax
        run: |
          node --check js/content-renderer.js
          node --check js/progress.js
          node --check js/memorisation-engine.js

      - name: Commit patched file
        run: |
          if git diff --quiet; then
            echo "No progress page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/content-renderer.js
          git commit -m "Show memorisation progress in mastery page"
          git push origin HEAD:feat/memorisation-progress
