name: One-time next-question benchmark migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-next-question-budget.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Correct next-question interaction benchmark
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/mobile-interaction-performance.mjs')
          text = path.read_text()
          old_budget = '  nextQuestionMs: 600\n'
          new_budget = '  nextQuestionMs: 200\n'
          if text.count(old_budget) != 1:
              raise SystemExit('expected one nextQuestionMs budget')
          text = text.replace(old_budget, new_budget, 1)
          marker = '  const oldStem = await page.locator(".q-stem").first().innerText();\n'
          replacement = '''  // Submitting focuses the answer reveal while the global smooth-scroll rule\n  // is still settling. That animation belongs to the previous interaction, so\n  // exclude it before timing the independent next-question transition.\n  await page.waitForTimeout(450);\n  const oldStem = await page.locator(".q-stem").first().innerText();\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected one next-question timing marker')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
          node --check scripts/mobile-interaction-performance.mjs
      - name: Commit benchmark correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile-interaction-performance.mjs
          git commit -m "Measure true next-question interaction latency"
          git push
