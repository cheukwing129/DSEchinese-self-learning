name: One-time rare-state coverage fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-rare-state-coverage.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch 404 loading and fatal coverage states
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/css-coverage.mjs"); t=p.read_text(); old="    if (route === \"/not-a-real-route\") {\n      await page.evaluate(() => { window.location.hash = \"#/not-a-real-route\"; });\n      await page.locator(\".launch-state.is-error\").waitFor({ state: \"visible\", timeout: 8000 });\n      await page.waitForTimeout(25);\n      visited += 1;\n      continue;\n    }"; new="    if (route === \"/not-a-real-route\") {\n      await page.evaluate(() => { window.location.hash = \"#/not-a-real-route\"; });\n      await page.locator(\".launch-state.is-not-found\").waitFor({ state: \"visible\", timeout: 8000 });\n      await page.evaluate(() => App.renderLoading(\"coverage loading\"));\n      await page.locator(\".launch-loading .loading-mark\").waitFor({ state: \"visible\", timeout: 2000 });\n      await page.evaluate(() => App.renderFatalError(\"coverage error\"));\n      await page.locator(\".launch-state.is-error\").waitFor({ state: \"visible\", timeout: 2000 });\n      await page.waitForTimeout(25);\n      visited += 1;\n      continue;\n    }"; assert old in t, "expected rare-state block not found"; p.write_text(t.replace(old,new,1))'
          node --check scripts/css-coverage.mjs
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-rare-state-coverage.yml
          git add scripts/css-coverage.mjs
          git commit -m "Cover 404 loading and fatal CSS states"
          git push
