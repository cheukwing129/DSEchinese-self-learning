  <!-- 逍遙遊：莊子「大瓠之種」意象，完整連貫的雙腹大葫蘆。 -->
  <symbol id="art-gourd" viewBox="0 0 220 132">
    <path d="M0 116C38 105 72 109 99 115C127 122 166 108 220 116V132H0Z"
          fill="#a3c0c4" opacity=".18"/>
    <path d="M8 121c29-7 53-7 79 0m45 2c26-10 48-9 78-1"
          fill="none" stroke="#7198a1" stroke-width="1.6" opacity=".55"
          stroke-linecap="round"/>
    <circle cx="187" cy="28" r="19" fill="#ddc69a" opacity=".28"/>
    <path d="M178 67q15-10 30-2M13 77q16-9 31-2" stroke="#b9915d"
          stroke-width="1.5" fill="none" opacity=".6" stroke-linecap="round"/>

    <!-- The silhouette is a single closed path, so the upper and lower bulbs
         form one gourd rather than two overlapping disconnected circles. -->
    <path d="M115 39
             C99 38 88 48 88 61
             C88 69 93 76 101 80
             C78 84 59 96 60 110
             C61 127 85 130 114 130
             C145 130 169 126 170 110
             C170 95 152 83 128 80
             C136 76 141 69 141 61
             C141 47 130 38 115 39Z"
          fill="#E7C58C" stroke="#193F59" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- one-piece volume, shading and gentle engraved contours -->
    <path d="M87 87C72 96 68 108 76 118C82 125 93 126 103 127"
          fill="none" stroke="#fff3d5" stroke-width="5" opacity=".65"
          stroke-linecap="round"/>
    <path d="M146 89C160 99 161 112 153 120C150 123 146 125 141 127"
          fill="none" stroke="#a77942" stroke-width="4" opacity=".35"
          stroke-linecap="round"/>
    <path d="M94 95C89 109 96 120 105 125M135 93C143 104 140 116 133 123"
          fill="none" stroke="#AE854E" stroke-width="1.5" opacity=".63"
          stroke-linecap="round"/>
    <!-- natural neck line, not a seam across the silhouette -->
    <path d="M102 80C108 84 120 84 127 80"
          fill="none" stroke="#9A713D" stroke-width="1.6" opacity=".62"
          stroke-linecap="round"/>
    <path d="M100 53C105 47 112 45 118 46" fill="none"
          stroke="#fff1cf" stroke-width="3" stroke-linecap="round" opacity=".72"/>
    <!-- stem and curling tendril -->
    <path d="M115 40C112 33 112 28 117 22C121 17 121 13 117 10"
          fill="none" stroke="#193F59" stroke-width="4" stroke-linecap="round"/>
    <path d="M115 39C113 31 114 25 117 22"
          fill="none" stroke="#779073" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M118 24C108 13 94 13 94 22C94 29 103 31 106 25C108 21 103 19 101 23"
          fill="none" stroke="#365F60" stroke-width="2.4" stroke-linecap="round"/>
    <!-- two sturdy leaves attached to vine -->
    <path d="M111 32C99 17 80 17 68 28C81 42 99 42 111 32Z"
          fill="#739A86" stroke="#193F59" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M119 29C135 14 152 16 164 28C152 40 133 40 119 29Z"
          fill="#8AA78B" stroke="#193F59" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M78 29C91 29 101 30 110 33M123 29C136 27 147 27 157 29"
          fill="none" stroke="#38685E" stroke-width="1.35" stroke-linecap="round"/>
    <!-- subtle floating-cloud accents -->
    <path d="M16 100c12-9 25-7 33-2m120 0c12-7 26-7 40 2"
          fill="none" stroke="#C1945B" stroke-width="1.5" opacity=".65"
          stroke-linecap="round"/>
  </symbol>
